model:
    model_name: sfno
    lr: 5.0e-4
    sfno:
        spectral_transform: 'sht'
        filter_type: 'linear'
        operator_type: 'dhconv'
        scale_factor: 1
        in_chans: 81
        out_chans: 73
        img_shape: [64, 128]
        embed_dim: 256
        num_layers: 12
        use_mlp: True
        mlp_ratio: 2.0
        activation_function: "gelu"
        encoder_layers: 1
        pos_embed: True
        drop_rate: 0.0
        drop_path_rate: 0.0
        num_blocks: 16
        sparsity_threshold: 0.0
        normalization_layer: 'instance_norm'
        hard_thresholding_fraction: 1.0
        use_complex_kernels: True
        big_skip: True

data:
    train_data_path: /glade/derecho/scratch/ayz/AMIP_train.h5
    val_data_path: /glade/derecho/scratch/ayz/AMIP_valid.h5
    climatology_path: /glade/derecho/scratch/ayz/climatology_1990_1996.pkl
    norm_stats_path: /glade/derecho/scratch/ayz/norm_stats_dict.pkl
        
    training_nsteps: 2
    val_nsteps: 41
    climatology_horizon: 7308 # 5 year
    climatology_start: 16072 # 1990-01-01

    batch_size: 16
    num_workers: 4

training:
    seed: 42
    devices: 1
    accelerator: gpu
    strategy: auto
    check_val_every_n_epoch: 1
    log_every_n_steps: 100
    max_epochs: 50
    log_dir: /glade/derecho/scratch/ayz/AMIP_logs/
    project: amip
    wandb_mode: online
    checkpoint: null