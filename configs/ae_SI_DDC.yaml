model:
    model_name: AE_DIT_DDC
    lr: 1.0e-5
    AE_DIT_DDC:
        encoder:
            downsample_factor: 4
        decoder:
            in_channels: 290
            out_channels: 145
            dim: 768
            num_heads: 8
            num_blocks: 12
            patch_size: 8
            nlat: 180
            nlon: 360
        scheduler:
            num_refinement_steps: 5
            num_train_steps: 11
            sigma_coupling: 1.0

data:
    data_dir: '/glade/derecho/scratch/awikner/ERA5/h5'
    upper_air_variables: ["temperature",
                  "u_component_of_wind",
                  "v_component_of_wind",
                  "geopotential",
                  "specific_total_water"]
    surface_variables: ["skin_temperature",
                     "surface_pressure",
                     "2m_temperature",
                     "2m_specific_humidity", 
                     "10m_u_component_of_wind", 
                     "10m_v_component_of_wind"]
    diagnostic_variables: ["USWRFtoa_24h",
                        "ULWRFtoa_24h", 
                       "USWRFsfc_24h",
                       "ULWRFsfc_24h",
                       "DSWRFsfc_24h",
                       "DLWRFsfc_24h",
                       "LHTFLsfc_24h",
                       "SHTFLsfc_24h",
                       "PRATEsfc_24h", 
                       "hcc_24h",
                       "lcc_24h", 
                       "mcc_24h", 
                       "mn2t_24h", 
                       "mx2t_24h", 
                       "mxtpr_24h"]
    constant_boundary_variables: ["geopotential_at_surface", 
                                    "land_sea_mask"]
    varying_boundary_variables: ["DSWRFtoa_24h", 
                                "global_mean_co2",
                                "sea_surface_temperature", # has nans
                                "sea_ice_cover"] # has nans
    mask_fill: {'sea_surface_temperature': 270.,
                'sea_ice_cover': 0.}
    train_year_start: 1979
    train_year_end: 2012
    val_year_start: 2012
    val_year_end: 2013
    mean_path: "/glade/derecho/scratch/ayz/ERA5/h5/normalize_mean.nc"
    std_path: "/glade/derecho/scratch/ayz/ERA5/h5/normalize_std.nc"
    forecast_lead_times: [1, 3, 5, 10]

    calendar: 'standard'
    data_timedelta_hours: 6
    timedelta_hours: 24
    has_year_zero: False
    levels: [1000, 975, 950, 925, 900, 875, 850, 800, 700, 600, 500, 400, 300, 250, 200, 175, 150, 125, 100, 70, 50, 30, 20, 10, 7, 5]
    horizontal_resolution: [180, 360]
    predict_delta: False
    epsilon_factor: 0
    num_inferences: 0

training:
    seed: 42
    devices: 4
    accelerator: gpu
    strategy: ddp
    precision: 32-true 
    check_val_every_n_epoch: 1
    log_every_n_steps: 10
    max_epochs: 50
    ema_decay: 0.99
    num_sanity_val_steps: 1
    log_dir: /glade/derecho/scratch/ayz/AMIP_logs/
    project: amip
    wandb_mode: online
    checkpoint: null
    description: SI_DDC_DiT
    accumulate_grad_batches: 4
