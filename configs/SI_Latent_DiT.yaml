model:
    model_name: SI_Latent_DiT
    lr: 1.0e-5
    SI_Latent_DiT:
        model:
            in_channels: 295 # 145+145+2+3
            out_channels: 145
            dim: 1536
            num_heads: 16
            num_blocks: 16
            patch_size: 2
            scalar_dim: 3
            nlat: 45
            nlon: 90
        scheduler:
            num_refinement_steps: 10
            num_train_steps: 21
            integrator: em
        encoder:
            downsample_factor: 4
        #decoder:
        #    out_channels: 249  # 6 + 26*9 + 9 = 249
        #    hidden_channels: 512
        #    z_channels: 249
        #    upsample_type: dc
        #    padding_mode: circular
        #    num_out_blocks: 3
        #    num_res_blocks: 3
        #decoder_checkpoint: /glade/derecho/scratch/ayz/AMIP_logs/AE_History_HFS_decoder_history2_hfs_42_2026-02-20T08-36-49/last.ckpt

data:
    train_data_path: /glade/derecho/scratch/ayz/AMIP_train_new.h5
    val_data_path: /glade/derecho/scratch/ayz/AMIP_valid_new.h5
    norm_stats_path: /glade/derecho/scratch/ayz/norm_stats_dict_new.pkl
    climatology_path: /glade/derecho/scratch/ayz/climatology_1990_1996.pkl
        
    training_nsteps: 2
    val_nsteps: 41 # 10 days
    val_horizon: 1460 # 1 year
    use_climatology: False
    climatology_horizon: 7308 # 5year #1460 # 1 year
    climatology_start: 16072 # 1990-01-01
    clouds: False

    batch_size: 1
    num_workers: 1 

training:
    seed: 42
    devices: 4
    accelerator: gpu
    strategy: ddp
    precision: 16-mixed
    check_val_every_n_epoch: 2
    log_every_n_steps: 10
    max_epochs: 50
    ema_decay: 0.99
    num_sanity_val_steps: 1
    log_dir: /glade/derecho/scratch/ayz/AMIP_logs/
    project: amip_forecast
    wandb_mode: online
    checkpoint: null
    accumulate_grad_batches: 8
    optimizer: adam