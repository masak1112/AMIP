model:
    model_name: DCAE
    lr: 5.0e-4
    DCAE:
        encoder:
            in_channels: 223 #249 # 6 + 26*9 + 9 = 249
            hidden_channels: [256, 512, 512]
            blocks_per_layer: [4, 4, 4]
        decoder:
            in_channels: 223 #249 # 6 + 26*9 + 9 = 249
            hidden_channels: [256, 512, 512]
            blocks_per_layer: [4, 4, 4]

data:
    train_data_path: /glade/derecho/scratch/ayz/AMIP_train.h5
    val_data_path: /glade/derecho/scratch/ayz/AMIP_valid.h5
    norm_stats_path: /glade/derecho/scratch/ayz/norm_stats_dict.pkl
        
    training_nsteps: 1
    val_nsteps: 1
    val_horizon: 1460 # 1 year
    use_climatology: False

    batch_size: 2
    num_workers: 0 # needs to be set to zero, otherwise errors in pickling Dataset objects

training:
    seed: 42
    devices: 4
    accelerator: gpu
    strategy: ddp
    precision: 16-mixed
    check_val_every_n_epoch: 1
    log_every_n_steps: 100
    max_epochs: 50
    ema_decay: 0.995
    num_sanity_val_steps: 1
    log_dir: /glade/derecho/scratch/ayz/AMIP_logs/
    project: amip
    wandb_mode: online
    checkpoint: null