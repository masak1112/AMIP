model:
    model_name: flow
    lr: 5.0e-4
    flow:
        

data:
    train_data_path: /glade/derecho/scratch/ayz/AMIP_train.h5
    val_data_path: /glade/derecho/scratch/ayz/AMIP_valid.h5
    climatology_path: /glade/derecho/scratch/ayz/climatology_1990_1996.pkl
    norm_stats_path: /glade/derecho/scratch/ayz/norm_stats_dict.pkl
        
        training_nsteps: 2
        val_nsteps: 41
        bias_horizon: 7308 # 5year
    normalizer:

    nlat: 64
    nlon: 128
    with_poles: False
    load_into_memory: False
    normalize: True
    batch_size: 16
    num_workers: 4
    pde: climate
    ae: False

training:
    seed: 42
    devices: 1
    accelerator: gpu
    strategy: auto
    check_val_every_n_epoch: 1
    log_every_n_steps: 100
    max_epochs: 50
    log_dir: logs/
    project: plasim_v2
    wandb_mode: online
    checkpoint: null