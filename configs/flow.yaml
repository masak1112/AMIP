model:
    model_name: flow
    lr: 5.0e-4
    flow:
        num_refinement_steps: 5
        num_train_steps: 21
        integrator: euler
    dit:
        encode_decode_params: 
            img_size: [26, 180, 360]
            emb_dim: 128 
            out_emb_dim: 256  
            patch_size: [2, 2, 2]
            surface_ch: 6
            level_ch: 8
            forcing_ch: 3
            invariant_ch: 2
            diagnostic_ch: 9
            encode_noise: True
        tensor_size: [14, 90, 180]
        emb_dim: 128
        cond_dim: 128 
        num_heads: [4, 8, 8, 4]
        window_size: [1, 5, 10]
        droppath_coeff: 0.0
        depth_multiplier: 1

data:
    train_data_path: /glade/derecho/scratch/ayz/AMIP_train.h5
    val_data_path: /glade/derecho/scratch/ayz/AMIP_valid.h5
    climatology_path: /glade/derecho/scratch/ayz/climatology_1990_1996.pkl
    norm_stats_path: /glade/derecho/scratch/ayz/norm_stats_dict.pkl
        
    training_nsteps: 2
    val_nsteps: 41 # 10 days
    val_horizon: 1460 # 1 year
    climatology_horizon: 120 #1460 # 1 year
    climatology_start: 16072 # 1990-01-01

    batch_size: 2
    num_workers: 1

training:
    seed: 42
    devices: 1
    accelerator: gpu
    strategy: auto
    precision: 16-mixed
    check_val_every_n_epoch: 1
    log_every_n_steps: 100
    max_epochs: 50
    ema_decay: 0.995
    num_sanity_val_steps: 1
    log_dir: /glade/derecho/scratch/ayz/AMIP_logs/
    project: amip
    wandb_mode: online
    checkpoint: null